# Render blueprint. Import this repo as a Blueprint (or create a Web Service pointing at it)
# and Render will build/start the API with these settings.
#
# Every secret below is marked `sync: false`, which means Render prompts for it in the
# dashboard instead of reading it from this file — no credentials ever live in git.
services:
  - type: web
    name: accvendor-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production

      # Where the storefront is hosted. Comma-separate to allow more than one origin.
      # This is the CORS whitelist — the API refuses anything not listed.
      - key: CLIENT_URL
        sync: false

      # MongoDB Atlas connection string. Allow access from anywhere (0.0.0.0/0) in Atlas
      # Network Access, or add Render's outbound IPs, or the API cannot connect.
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: accvendor

      # Generate long random values (e.g. `openssl rand -hex 48`). Never reuse the dev ones.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CREDENTIAL_URL_SECRET
        generateValue: true

      # Encrypts stored TOTP secrets behind shareable 2FA links. Required in production: the
      # code's fallback value is published in this repository, so booting without a real one
      # means anyone holding a copy of the database can decrypt every shared secret. Changing
      # it invalidates every outstanding share link.
      - key: TOTP_SHARE_SECRET
        generateValue: true
      - key: TOTP_SHARE_EXPIRES_HOURS
        value: "24"

      # Unpaid orders are held this long, then expired by a sweep that runs every minute.
      - key: UNPAID_ORDER_WINDOW_MINUTES
        value: "60"
      - key: UNPAID_ORDER_CRON_SCHEDULE
        value: "* * * * *"

      # A ticket the admin has answered auto-closes after this much customer silence.
      - key: TICKET_AUTO_CLOSE_HOURS
        value: "48"
      - key: TICKET_AUTO_CLOSE_CRON_SCHEDULE
        value: "15 * * * *"

      # Signup/OTP cooldowns, measured against timestamps on the pending-signup record so a
      # page refresh cannot shorten them.
      - key: SIGNUP_COOLDOWN_SECONDS
        value: "5"
      - key: OTP_RESEND_COOLDOWN_SECONDS
        value: "5"
      - key: OTP_MAX_VERIFY_ATTEMPTS
        value: "5"
      - key: OTP_VERIFY_LOCK_MINUTES
        value: "15"

      # Write-side rate-limit buckets for repeatable customer actions, plus a search ceiling.
      - key: RATE_LIMIT_ORDER_MAX
        value: "20"
      - key: RATE_LIMIT_REVIEW_MAX
        value: "10"
      - key: RATE_LIMIT_TICKET_MAX
        value: "15"
      - key: RATE_LIMIT_SEARCH_MAX
        value: "120"

      # Absolute, publicly reachable logo URL for transactional emails — a mail client cannot
      # resolve a relative path, so a local one shows every recipient a broken image.
      - key: EMAIL_LOGO_URL
        sync: false

      # Year shown in the email footer; keep it in step with Admin → Settings → Footer.
      - key: COPYRIGHT_YEAR
        value: "2024"

      # Community invite shown in the storefront footer and admin sidebar. Optional.
      - key: DISCORD_URL
        sync: false

      # Email. Resend is required here rather than merely preferred: Render blocks outbound
      # SMTP (ports 25/465/587), so an SMTP transport hangs on this platform. Resend's API is
      # plain HTTPS on 443. Without a key the app still boots and logs emails to the console.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false

      # SMTP fallback — unused while RESEND_API_KEY is set, and non-functional on Render.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false

      # Cloudinary (optional — payment-proof/attachment uploads are disabled without it).
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # First admin account, created by `npm run seed`.
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
